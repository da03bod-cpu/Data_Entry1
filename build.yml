name: Build and push worker image

# بيبني الـimage على سيرفرات GitHub (مجانًا) ويرفعه على GitHub Container Registry (ghcr.io).
# مفيش أي secrets مطلوبة - بيستخدم GITHUB_TOKEN الجاهز.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - handler.py
      - config.py
      - requirements.txt
      - .github/workflows/build.yml
  workflow_dispatch: # تشغيل يدوي من تبويب Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # الـimage كبير (torch + CUDA)، ومساحة الـrunner الافتراضية ممكن متكفيش
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=build-${{ github.run_number }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Print image name for Runpod
        run: |
          echo "=============================================="
          echo "استخدم الاسم ده في Runpod:"
          echo "ghcr.io/${GITHUB_REPOSITORY,,}:build-${{ github.run_number }}"
          echo "=============================================="
